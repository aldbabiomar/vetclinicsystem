# The package and its templates. The root's own *.py (run.py, setup.py) are
# swept too; `**.py` at the root is deliberately not used, because it would
# sweep tests/, whose fixture strings are not user-facing and would pollute
# the catalogue.
[python: *.py]
[python: vcs/**.py]
[jinja2: vcs/templates/**.html]
